<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#10204a"/>
      <stop offset="0.65" stop-color="#070d22"/>
      <stop offset="1" stop-color="#02040c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="#1d3a6e" stroke-width="3"/>
  <!-- стены лабиринта: сначала широкое свечение, потом яркая жила -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#27b8ff" opacity="0.14" stroke-width="20">
      <path d="M46 46 H210 V210 H46 V92"/>
      <path d="M88 168 V88 H168 V168 H116"/>
    </g>
    <g stroke="#27b8ff" opacity="0.30" stroke-width="11">
      <path d="M46 46 H210 V210 H46 V92"/>
      <path d="M88 168 V88 H168 V168 H116"/>
    </g>
    <g stroke="#7fe3ff" stroke-width="4.5">
      <path d="M46 46 H210 V210 H46 V92"/>
      <path d="M88 168 V88 H168 V168 H116"/>
    </g>
  </g>
  <!-- лампа в центре: тёплый свет против холодных стен -->
  <circle cx="128" cy="128" r="58" fill="url(#halo)"/>
  <circle cx="128" cy="128" r="15" fill="url(#orb)"/>
</svg>
